[project]
name = "m1mic-mlx"
version = "0.1.0"
description = "Train a Unitree G1 whole-body motion tracker on a MacBook with MuJoCo and MLX"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mlx>=0.32", "mujoco>=3.17", "numpy>=2"]

[project.optional-dependencies]
render = ["pillow"]

[tool.setuptools]
packages = ["m1mic"]

[tool.ruff]
line-length = 120
